name: Build Reel Checker (Flutter)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # The GitHub connector cannot push binary files, so binaries are
      # recreated on the runner: launcher icons (tools/make_icons.py),
      # the signing keystore (base64 in the repo) and gradle-wrapper.jar.
      - name: Generate launcher icons
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 tools/make_icons.py

      - name: Restore signing keystore
        run: base64 -d android/app/debug.keystore.b64 > android/app/debug.keystore

      - name: Restore Gradle wrapper jar
        run: |
          curl -sL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar

      - name: Get dependencies
        run: flutter pub get

      - name: Test preview UI
        run: node --test test/preview_ui.test.js

      - name: Analyze
        run: flutter analyze || echo "analyze warnings ignored for OTA"

      # v4.4.6: obfuscated build + CI-injected app secret (license
      # check). The secret lives only in GitHub Secrets, never in
      # the repo — a build from cloned source has an empty secret
      # and the license server refuses it.
      - name: Build release APK
        env:
          APP_SECRET: ${{ secrets.REELCHECKER_APP_SECRET }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info --dart-define=APP_SECRET=$APP_SECRET

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reel-checker-flutter-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # OTA: attach the built APK to the release matching pubspec version
      # (e.g. version 4.4.4 -> tag v4.4.4). The release must already exist;
      # --clobber replaces the asset on re-runs of the same version.
      - name: Upload APK to release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/')
          gh release upload "v$VERSION" build/app/outputs/flutter-apk/app-release.apk --clobber

  ios:
    name: iOS (compile check, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate launcher icons
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 tools/make_icons.py

      - name: Get dependencies
        run: flutter pub get

      # Unsigned build: proves the iOS code compiles only.
      # A real installable iPhone build needs an Apple Developer account.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: reel-checker-ios-app
          path: build/ios/iphoneos/Runner.app
          retention-days: 30
